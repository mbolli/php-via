<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    {{ via_head }}
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ base_path }}via.css">
    {{ head_content }}
</head>
<body>
    <div data-show="$_disconnected" class="connection-warning">⚠️ Warning: Not connected to server.</div>
    <div class="page-layout">
        <div class="container" id="content">
            {{ content }}
        </div>

        <aside class="debug-sidebar">
            <h3>🔍 Live Signals</h3>
            <pre data-json-signals></pre>
        </aside>
    </div>
    {{ foot_content }}
    {{ via_foot }}
</body>
</html>
